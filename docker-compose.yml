services:
  redroid:
    image: redroid/redroid:12.0.0_64only-latest
    privileged: true
    pull_policy: always
    volumes:
      - /dev/binder1:/dev/binder
      - /dev/binder2:/dev/hwbinder
      - /dev/binder3:/dev/vndbinder
      - android-cloud-data:/data
    ports:
      - "${ANDROID_CLOUD_PORT:-5555}:5555"
    command:
      - androidboot.use_memfd=true
      - androidboot.redroid_width=${ANDROID_CLOUD_WIDTH:-720}
      - androidboot.redroid_height=${ANDROID_CLOUD_HEIGHT:-1280}
      - androidboot.redroid_fps=${ANDROID_CLOUD_FPS:-15}
      - androidboot.redroid_dpi=${ANDROID_CLOUD_DPI:-320}
    networks:
      - android-cloud-net
    restart: unless-stopped

  ws-scrcpy:
    image: scavin/ws-scrcpy:latest
    ports:
      - "8000"
    restart: unless-stopped
    depends_on:
      - redroid
    networks:
      - android-cloud-net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until adb connect redroid:5555 2>/dev/null; do sleep 2; done
        echo "[OK] ws-scrcpy connected to redroid"
        npm start

  panel:
    build:
      context: ./panel
      dockerfile: Dockerfile
    image: android-cloud/panel
    ports:
      - "${ANDROID_CLOUD_PANEL_PORT:-8233}:8233"
    environment:
      - ADB_HOST=redroid
      - PORT=8233
    depends_on:
      - redroid
      - ws-scrcpy
    networks:
      - android-cloud-net
    restart: unless-stopped

networks:
  android-cloud-net:

volumes:
  android-cloud-data:
